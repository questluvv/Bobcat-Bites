<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bobcat Bites</title>
<link rel="manifest" href="manifest-student.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobcat Bites">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --blue:#1a73e8; --blue-dark:#135cc0; --blue-light:#e8f1fd; --blue-line:#d4e4f9; --red:#e5484d; --red-light:#fdecec; --bg:#f6f9fd; --card:#fff; --ink:#17222e; --muted:#64748b; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:84px; }
  header { background:#fff; color:var(--ink); padding:16px 20px; position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--blue-line); }
  header h1 { font-size:20px; color:var(--blue-dark); display:flex; align-items:center; gap:8px; } header h1 span { color:var(--red); }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(23,58,110,.06), 0 4px 14px rgba(23,58,110,.05); border:1px solid #eaf1fa; }
  .truck { display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:transform .1s; }
  .truck:active { transform:scale(.99); }
  .pill { font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap; }
  .pill.open { background:var(--blue-light); color:var(--blue-dark); } .pill.closed { background:var(--red-light); color:var(--red); }
  .pill.soon { background:#eef2f7; color:#4a5768; }
  .pill.placed { background:#eef2f7; color:var(--muted); } .pill.confirmed { background:var(--blue-light); color:var(--blue-dark); }
  .pill.ready { background:var(--red-light); color:var(--red); } .pill.picked_up,.pill.cancelled,.pill.pending_payment { background:#eef2f7; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  h2 { font-size:17px; margin-bottom:10px; } h3 { font-size:15px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eef3fa; }
  .item:last-child { border-bottom:none; }
  /* A big half-pie rising off the bottom of the row, the way Daily Dough's own
     menu board frames them: the pie sits ON the divider line and comes up to
     about mid-row, with the item's text alongside it. The medallion is a full
     circle drawn at 2x the box height with overflow hidden, so only the upper
     hemisphere shows and the row's bottom edge reads as the surface it rests
     on. align-self drops it to that edge while the rest of the row stays
     centred; the negative margin carries it down over the row's own padding so
     it meets the divider instead of floating above it. */
  /* Pie on the left, text and the stepper stacked to its right.
     These three used to sit in a single row, which left the text column about
     155px wide: "Red sauce, mozzarella, & shredded parmesan cheese" wrapped
     over five lines and every row grew to ~140px tall. Raising the touch
     targets to 44px made it worse. Giving the stepper its own line hands the
     description the full remaining width and roughly halves the row height. */
  .item.peeked {
    display:grid; grid-template-columns:96px minmax(0,1fr);
    grid-template-areas:"pie text" "pie actions";
    column-gap:12px; row-gap:4px; align-items:start;
  }
  .item.peeked .peek { grid-area:pie; }
  .it-main { grid-area:text; min-width:0; }
  /* Price sits next to the stepper: the number and the control that changes it
     belong on the same line. */
  .it-actions { grid-area:actions; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .price { font-weight:700; font-variant-numeric:tabular-nums; }
  .prep { white-space:nowrap; }
  .peek { position:relative; flex:none; align-self:end; margin-bottom:-10px;
          width:96px; height:48px; overflow:hidden; pointer-events:none;
          filter:drop-shadow(0 -2px 4px rgba(23,58,110,.18)); }
  /* The drawn fallback is a whole circle whose lower half the box clips away. */
  .peek > svg { display:block; width:96px; height:96px; border-radius:50%; }
  /* A photo is already shot as a dome on the truck's own menu board, so it
     fills the visible box directly rather than being a circle with half of it
     thrown away — which would waste most of the pixels on something clipped.
     It sits ON TOP of the drawing: if the photo fails to load its onerror
     removes it and the drawn pie underneath is revealed, instead of the menu
     showing a row of broken-image glyphs. */
  .peek > img { position:absolute; inset:0; display:block; width:96px; height:48px;
                object-fit:cover; border-radius:48px 48px 0 0; }
  /* Free-text locations open in a maps app. Styled as a link so it is obviously
     tappable, but kept at .muted's size so the card layout does not shift. */
  .maploc { display:inline-block; color:var(--blue); font-size:13px; font-weight:600; text-decoration:none; }
  .maploc:active { opacity:.6; }
  /* 44x44 is the Apple HIG / WCAG floor for a touch target. These were 32x32,
     which is a real mis-tap risk on the control students use most — every
     quantity change on the menu goes through them. */
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:44px; height:44px; border-radius:11px; border:1px solid var(--blue-line); background:var(--blue-light); font-size:20px; font-weight:700; color:var(--blue-dark); cursor:pointer; touch-action:manipulation; }
  .qty button:disabled { opacity:.35; cursor:not-allowed; }
  .qty > b { min-width:1.25em; text-align:center; font-variant-numeric:tabular-nums; }
  /* Never remove the focus ring — keyboard users lose their place without it. */
  .qty button:focus-visible, button.primary:focus-visible, .maploc:focus-visible,
  button.link:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .truck.unorderable { opacity:.6; }
  .banner.warn { background:var(--red-light); border-color:#f6c8ca; color:#b53338; }
  button.primary { width:100%; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .1s; box-shadow:0 3px 10px rgba(26,115,232,.25); }
  button.primary:disabled { opacity:.4; }
  button.primary:not(:disabled):active { transform:scale(.97); }
  button.link { background:none; border:none; color:var(--blue); font-weight:600; font-size:14px; cursor:pointer; padding:0 0 10px; }
  input { width:100%; padding:12px; border:1px solid var(--blue-line); border-radius:10px; font-size:15px; margin-bottom:10px; background:#fff; transition:border-color .15s, box-shadow .15s; }
  input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,115,232,.15); }
  .qty button:not(:disabled):active { transform:scale(.92); }
  .toast { position:fixed; left:50%; bottom:94px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; transition:opacity .2s, transform .2s; z-index:100; max-width:86%; text-align:center; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error { background:var(--red); }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--blue-line); display:flex; }
  nav button { flex:1; padding:12px 0 18px; border:none; background:none; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; }
  nav button.active { color:var(--blue); }
  nav button .ico { display:block; font-size:20px; margin-bottom:2px; }
  .countdown { font-size:40px; font-weight:800; color:var(--blue); text-align:center; margin:6px 0; font-variant-numeric:tabular-nums; }
  .code { font-size:28px; font-weight:800; letter-spacing:6px; color:#fff; background:var(--blue); border-radius:12px; text-align:center; padding:10px; margin-top:8px; }
  .banner { background:var(--blue-light); border:1px solid var(--blue-line); color:#1c5aa8; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .total { display:flex; justify-content:space-between; font-weight:700; font-size:16px; padding-top:10px; }
  .sitefoot { max-width:520px; margin:0 auto; padding:4px 16px 20px; text-align:center; font-size:12px; color:var(--muted); }
  .sitefoot a { color:var(--muted); margin:0 6px; text-decoration:none; white-space:nowrap; }
  .sitefoot a:hover { color:var(--blue); text-decoration:underline; }
  .sitefoot-note { margin-top:6px; font-size:11px; opacity:.85; }
  /* the 6px anchor margin above is for the policy link row; inside the credit
     sentence it detaches the punctuation from the link text. */
  .sitefoot-note a { margin:0; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }

  /* ---- Per-vendor menu theming ----------------------------------------
     A truck can bring its own colours to its own menu screen. Everything here
     is scoped under [data-vendor-theme], so the trucks list, checkout, orders
     and every other truck keep the default blue — one truck's branding can
     never leak into another's.

     Daily Dough's palette is sampled from their own printed menu board rather
     than invented: #4d0202 is 98% of that board's background, with cream type
     and a warm crust gold. Every foreground/background pair below was measured
     against WCAG AA and the weakest is 7.29:1, so none of it had to be
     lightened to stay readable. */
  [data-vendor-theme="daily-dough"] {
    --dd-bg:#4d0202; --dd-surface:#5f1010; --dd-line:#7d2626;
    --dd-cream:#ffe4e1; --dd-cream-dim:#e2b9b7;
    --dd-gold:#f1b545; --dd-gold-light:#ffc579;
  }
  /* The card becomes the menu board: deep maroon, a warm top-light to give the
     flat colour some depth, and a gold hairline standing in for the board's
     printed edge. */
  [data-vendor-theme="daily-dough"] .card {
    background:
      radial-gradient(120% 80% at 50% -20%, rgba(241,181,69,.16), transparent 60%),
      var(--dd-bg);
    border:1px solid var(--dd-line);
    box-shadow:0 2px 4px rgba(58,0,0,.28), 0 10px 28px rgba(58,0,0,.22);
  }
  [data-vendor-theme="daily-dough"] h2,
  [data-vendor-theme="daily-dough"] .item b { color:var(--dd-cream); }
  [data-vendor-theme="daily-dough"] .muted { color:var(--dd-cream-dim); }
  [data-vendor-theme="daily-dough"] .maploc { color:var(--dd-gold-light); }
  [data-vendor-theme="daily-dough"] .item { border-bottom-color:var(--dd-line); }
  /* Price reads as the decision point, so it gets the gold and a tabular
     figure set — proportional digits make a column of prices jitter. */
  [data-vendor-theme="daily-dough"] .price {
    color:var(--dd-gold); font-weight:700; font-variant-numeric:tabular-nums;
  }
  [data-vendor-theme="daily-dough"] .prep { color:var(--dd-cream-dim); }
  /* Size badge: 18" Whole vs Slice is the difference between $30 and $6.25, so
     it is pulled out of the description where it was buried mid-sentence. */
  .size-tag {
    display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px;
    font-size:11px; font-weight:700; letter-spacing:.02em; vertical-align:1px;
    border:1px solid var(--blue-line); color:var(--blue-dark); background:var(--blue-light);
  }
  [data-vendor-theme="daily-dough"] .size-tag {
    border-color:var(--dd-gold); color:var(--dd-gold-light); background:rgba(241,181,69,.12);
  }
  [data-vendor-theme="daily-dough"] .qty button {
    background:rgba(255,228,225,.06); border-color:var(--dd-gold); color:var(--dd-gold-light);
  }
  [data-vendor-theme="daily-dough"] .qty > b { color:var(--dd-cream); }
  [data-vendor-theme="daily-dough"] .qty button:focus-visible,
  [data-vendor-theme="daily-dough"] .maploc:focus-visible,
  [data-vendor-theme="daily-dough"] button.primary:focus-visible {
    outline-color:var(--dd-gold-light);
  }
  /* Gold CTA on maroon text: 10.2:1, and it reads as the truck's own button
     rather than the platform's. */
  [data-vendor-theme="daily-dough"] button.primary {
    background:var(--dd-gold); color:#3a0000; box-shadow:0 3px 12px rgba(77,2,2,.35);
  }
  [data-vendor-theme="daily-dough"] .banner {
    background:rgba(255,228,225,.08); border-color:var(--dd-line); color:var(--dd-cream);
  }
  [data-vendor-theme="daily-dough"] .banner.warn {
    background:rgba(229,72,77,.18); border-color:#a33; color:#ffd9d9;
  }
  [data-vendor-theme="daily-dough"] .empty { color:var(--dd-cream-dim); }

  /* ---- Drink pills (top of the menu) + the pizza detail sheet ---------- */
  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .pillbtn { border:1px solid var(--blue-line); background:var(--blue-light); color:var(--blue-dark);
    border-radius:99px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer;
    touch-action:manipulation; min-height:40px; }
  .pillbtn.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .pillbtn:disabled { opacity:.4; cursor:not-allowed; }
  .pills-label { font-size:13px; font-weight:700; color:var(--muted); margin:2px 0 6px; }
  [data-vendor-theme="daily-dough"] .pillbtn {
    background:rgba(255,228,225,.06); border-color:var(--dd-gold); color:var(--dd-gold-light); }
  [data-vendor-theme="daily-dough"] .pillbtn.on { background:var(--dd-gold); color:#3a0000; border-color:var(--dd-gold); }
  [data-vendor-theme="daily-dough"] .pills-label { color:var(--dd-cream-dim); }
  /* The "Choose" affordance on a pizza card that has sizes/toppings. */
  .choose { border:1px solid var(--blue); background:var(--blue-light); color:var(--blue-dark);
    border-radius:11px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer;
    touch-action:manipulation; min-height:44px; }
  .choose:disabled { opacity:.4; cursor:not-allowed; }
  [data-vendor-theme="daily-dough"] .choose { background:rgba(241,181,69,.14); border-color:var(--dd-gold); color:var(--dd-gold-light); }

  /* Sheet: a bottom sheet over a scrim. Its own container (#sheet) so the
     menu re-rendering on a timer never wipes a half-made choice. */
  .sheet-back { position:fixed; inset:0; background:rgba(15,30,60,.5); z-index:200;
    display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--card); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:18px 18px 22px; max-height:88vh; overflow-y:auto;
    box-shadow:0 -8px 30px rgba(15,30,60,.28); }
  .sheet h3 { font-size:20px; margin-bottom:2px; }
  .sheet .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .sheet .grp { font-size:13px; font-weight:700; color:var(--muted); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.03em; }
  .sheet .grp .req { color:var(--red); }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--blue-line); border-radius:12px; padding:12px 14px; margin-bottom:8px;
    cursor:pointer; touch-action:manipulation; background:#fff; }
  .opt.sel { border-color:var(--blue); background:var(--blue-light); }
  .opt.optdim { opacity:.45; }
  .disclaimer { font-size:12.5px; line-height:1.4; color:var(--muted); background:var(--blue-light);
    border:1px solid var(--blue-line); border-radius:10px; padding:9px 11px; margin:2px 0 6px; }
  [data-vendor-theme="daily-dough"] .disclaimer { background:rgba(255,228,225,.08); border-color:var(--dd-line); color:var(--dd-cream-dim); }
  .opt .lab { font-weight:600; }
  .opt .pr { font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; }
  .opt .box { width:22px; height:22px; border-radius:6px; border:2px solid var(--blue-line); flex:none; display:grid; place-items:center; font-size:14px; color:#fff; }
  .opt .box.radio { border-radius:50%; }
  .opt.sel .box { background:var(--blue); border-color:var(--blue); }
  .sheet-actions { display:flex; align-items:center; gap:12px; margin-top:18px; }
  .sheet-actions .qty { flex:none; }
  .sheet-actions .primary { flex:1; margin:0; }
  .sheet .close { float:right; background:none; border:none; font-size:24px; line-height:1; color:var(--muted); cursor:pointer; padding:0 4px; }
  [data-vendor-theme="daily-dough"] .sheet { background:var(--dd-bg); border:1px solid var(--dd-line); }
  [data-vendor-theme="daily-dough"] .sheet h3 { color:var(--dd-cream); }
  [data-vendor-theme="daily-dough"] .sheet .sub, [data-vendor-theme="daily-dough"] .sheet .grp { color:var(--dd-cream-dim); }
  [data-vendor-theme="daily-dough"] .opt { background:var(--dd-surface); border-color:var(--dd-line); color:var(--dd-cream); }
  [data-vendor-theme="daily-dough"] .opt.sel { border-color:var(--dd-gold); background:rgba(241,181,69,.14); }
  [data-vendor-theme="daily-dough"] .opt .pr { color:var(--dd-gold-light); }
  [data-vendor-theme="daily-dough"] .opt.sel .box { background:var(--dd-gold); border-color:var(--dd-gold); color:#3a0000; }
  [data-vendor-theme="daily-dough"] .sheet .close { color:var(--dd-cream-dim); }
  /* The pie sits on a dark board now, so it needs a light rim to separate from
     it rather than the drop shadow that worked against white. */
  [data-vendor-theme="daily-dough"] .peek {
    filter:drop-shadow(0 -2px 5px rgba(0,0,0,.45));
  }
  /* Looping or sliding motion is genuinely unpleasant with a vestibular
     disorder, and none of this is load-bearing. */
  @media (prefers-reduced-motion: reduce) {
    .qty button, button.primary { transition:none; }
  }
  /* Bobcat mark. Cat silhouette by game-icons.net under CC BY 3.0 — credited in
     the footer, which that licence requires. Recolours via currentColor.
     The swish is deliberately uneven: a symmetrical sine reads mechanical, so the
     keyframes loiter, flick once, and settle, on a long cycle. */
  .bobcat { height:1.25em; width:auto; color:var(--blue); flex:none; }
  .bobcat .tail { transform-origin:80px 400px; transform-box:view-box; animation:bb-swish 5s ease-in-out infinite; }
  @keyframes bb-swish {
    0%,100% { transform:rotate(-5deg); }
    14% { transform:rotate(1deg); }
    28% { transform:rotate(-3deg); }
    44% { transform:rotate(4deg); }
    54% { transform:rotate(7deg); }
    64% { transform:rotate(2deg); }
    80% { transform:rotate(-6deg); }
    92% { transform:rotate(-2deg); }
  }
  /* Looping motion is genuinely unpleasant with a vestibular disorder. */
  @media (prefers-reduced-motion: reduce) { .bobcat .tail { animation:none; } }
</style>

<main id="view"></main>
<!-- The pizza detail sheet renders here, outside #view, so a menu re-render on
     the refresh timer never wipes a size/topping choice mid-selection. -->
<div id="sheet"></div>

// ---------- menu-item option helpers ----------

const itemToppings = (m) => itemMods(m).filter((x) => x.kind !== "sauce");

    + (variant ? ` (${variant.label}${sauces.length ? ", " + sauces.map((s) => s.label).join(", ") : ""})` : "")
    + (tops.length ? ` + ${tops.map((t) => t.label).join(", ")}` : "");

const lineKey = (m, variant, mods) => [m.id, variant ? variant.id : "", mods.map((x) => x.id).slice().sort().join(",")].join("|");

// ---------- cart (a list of configured lines) ----------
function addLine(m, variant, mods, qty) {

    key, menu_item_id: m.id, name: lineLabel(m, variant, mods),

const cartCount = () => state.cart.reduce((a, l) => a + l.qty, 0);

// Flat item (no sizes, no toppings): the inline +/- stepper on the card, kept

async function placeOrder() {
  if (!isOrderable(state.truck)) { toast("This truck isn't accepting orders right now.", "error"); go("trucks"); return; }
  if (!$("s_name").value.trim()) { toast("Enter your name so the truck knows who to make it for.", "error"); $("s_name").focus(); return; }
  const btn = $("placeBtn"); btn.disabled = true; btn.textContent = "Placing…";
  const details = {
    device_key: deviceKey,
    student_name: $("s_name").value.trim(), phone: $("s_phone").value.trim(),
    vendor_id: state.truck.id,
    items: state.cart.map((l) => ({ menu_item_id: l.menu_item_id, variant_id: l.variant_id || undefined, modifier_ids: l.modifier_ids, quantity: l.qty })),
  };
  localStorage.setItem("bb_name", details.student_name);
  // Stripe Checkout is the ONLY way to create an order. There used to be a
  // fallback here to the api function's place_order, used when a truck had not
  // finished Stripe onboarding — but that action took no payment at all, so
  // anyone who read this file could POST a real ticket onto a truck's screen and
  // have food cooked for free. The action is gone server-side; this is the
  // client half of closing that hole. A truck without a payout account now gets
  // a plain refusal instead of a free order.
  try {

    btn.textContent = `Pay ${money(cartTotal())} with card`;

}

// Only offered while the order is still 'placed' — the refund policy allows a

      <div${theme ? ` data-vendor-theme="${esc(theme)}"` : ""}>
      <div class="card"><h2>${esc(t.name)}</h2>${locationLink(t.default_location, "")}</div>` +
      (orderable ? "" : !takesCards(t) && t.is_open
        ? `<div class="banner">This truck is still finishing its card-payment setup, so you can browse the menu but not order yet.</div>`
        : t.is_open
        ? `<div class="banner">⏸️ Taking a quick break — ${cd ? `back in <b style="font-variant-numeric:tabular-nums">${cd}</b>.` : left === 0 ? "back any minute now!" : "back soon!"} Browse the menu meanwhile.</div>`
        : `<div class="banner warn">🚫 This truck is closed right now — you can browse the menu but can't order.</div>`) +
      drinkPills(orderable) +
      (!state.menu.length ? `<div class="card"><div class="empty">Loading menu…</div></div>`
        : (() => { const mains = state.menu.filter((m) => m.category !== "drink");
            return mains.length ? `<div class="card">` + mains.map((m) => menuItemRow(m, orderable, t.name)).join("") + `</div>` : ""; })()) +
      (orderable && cartCount() ? `<button class="primary" onclick="state.screen='checkout';render()">Checkout · ${cartCount()} item${cartCount() > 1 ? "s" : ""} · ${money(cartTotal())}</button>` : "") +
      `</div>`;
  }
  if (state.screen === "checkout") {
    v.innerHTML = `<button class="link" onclick="state.screen='menu';render()">← Back to menu</button>
      <div class="card"><h2>Checkout — ${esc(state.truck.name)}</h2>` +
      state.cart.map((l) => `<div class="item"><span>${l.qty}× ${esc(l.name)}</span><span>${money(l.unit * l.qty)}</span></div>`).join("") +
      `<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div></div>
      <form class="card" onsubmit="event.preventDefault();placeOrder()"><h3 style="margin-bottom:10px">Your info</h3>
        <input id="s_name" placeholder="Name (shown to the truck)" value="${esc(localStorage.getItem("bb_name") || "")}">
        <input id="s_phone" type="tel" placeholder="Phone (optional)">
        ${{
          on: `<div class="banner">💳 Secure card payment via Stripe — you'll get a receipt by email.</div>`,
          checking: `<div class="banner">Checking card payments…</div>`,
          off: `<div class="banner">Card payments aren't switched on yet, so this order can't be placed.</div>`,
          unreachable: `<div class="banner warn">Couldn't reach the payment service. Check your connection, then
            <button type="button" class="link" style="padding:0" onclick="retryPay()">try again</button>.</div>`,
        }[payState()]}
        <button class="primary" type="submit" id="placeBtn"${payState() === "on" ? "" : " disabled"}>${
          { on: `Pay ${money(cartTotal())} with card`,
            checking: "Checking…",
            off: "Card payments unavailable",
            unreachable: "Can't reach payments" }[payState()]}</button>
      </form>`;
  }
  if (state.screen === "orders") {
    const canAskNotify = "Notification" in window && Notification.permission === "default";
    v.innerHTML = `<h2>My orders</h2>` +
      (canAskNotify ? `<div class="banner">🔔 <a href="javascript:void(0)" onclick="requestNotifyPermission()" style="color:inherit;font-weight:700">Turn on notifications</a> to know the moment your order's confirmed or ready.</div>` : "") +
      (state.orders.length ? state.orders.map((o) => {
        const cd = o.status === "confirmed" ? countdownFor(o) : null;
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(o.vendors?.name || "Truck")}</h3><span class="pill ${o.status}">${abandonedPayment(o) ? "not paid" : o.status.replace("_", " ")}</span></div>
          ${locationLink(o.vendors?.default_location, "")}<div class="muted">${new Date(o.created_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
          ${(o.order_items || []).map((i) => `<div class="item"><span>${i.quantity}× ${esc(i.item_name_snapshot)}</span><span>${money(i.unit_price_cents * i.quantity)}</span></div>`).join("")}
          <div class="total"><span>Total</span><span>${money(o.total_cents)}</span></div>
          ${o.status === "placed" ? `<div class="banner">Waiting for the truck to confirm…</div><div style="text-align:center"><button class="link" style="color:var(--red)" onclick="studentCancel('${o.id}')">Cancel order</button></div>` : ""}
          ${o.status === "pending_payment" ? (abandonedPayment(o)
            ? `<div class="banner">Payment wasn't completed, so this never reached the truck and you weren't charged. It clears itself shortly — or just order again.</div>`
            : `<div class="banner">💳 Finishing payment… this updates on its own once Stripe confirms.</div>`) : ""}
          ${cd ? `<div class="muted" style="text-align:center">Ready in about</div><div class="countdown">${cd.text}</div><div class="muted" style="text-align:center;margin-bottom:6px">${etaMotto(cd.left)}</div>` : ""}
          ${o.status === "ready" ? `<div class="banner warn" style="font-weight:700">🎉 Ready! Show this code at the window:</div>` : ""}
          ${o.status !== "cancelled" && o.status !== "picked_up" && o.status !== "pending_payment" ? `<div class="code">${esc(o.pickup_code || "")}</div>` : ""}
        </div>`;
      }).join("") : `<div class="empty">No orders yet.<br>Hit the Trucks tab and grab something 🌯</div>`);
  }
}
// Coming back from Stripe Checkout?
const backFromPay = new URLSearchParams(location.search);
if (backFromPay.has("paid")) {
  history.replaceState(null, "", location.pathname);
  go("orders");
  requestNotifyPermission();
  toast("💳 Payment received — your order is on its way to the truck!");
} else if (backFromPay.has("pay_cancelled")) {
  history.replaceState(null, "", location.pathname);
  go("trucks");
  toast("Payment cancelled — no order was placed.", "error");
} else {
  go("trucks");
}
startOrderPolling();
probeStripe();

// PWA: register service worker (only works over https — i.e. once hosted on Netlify)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Re-assert the push subscription on every load: browsers can silently rotate
  // or drop an endpoint, and a stale row means a silent "order ready".
  navigator.serviceWorker.ready
    .then(() => { if (window.Notification && Notification.permission === "granted") requestNotifyPermission(); })
    .catch(() => {});
}
</script>
</body>
</html>
